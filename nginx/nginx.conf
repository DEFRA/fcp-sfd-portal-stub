events {
    worker_connections 1024;
}

http {
    upstream portal {
        server fcp-sfd-portal-stub:3020;
    }

    upstream uploader {
        server document-upload-stub:3021;
    }

    server {
        listen 80;
        server_name localhost;

        # Increase max body size for file uploads (100MB)
        client_max_body_size 100M;

        # Gateway routing for file uploads
        location /upload-and-scan/ {
            proxy_pass http://uploader;
        }

        # All other requests go to the portal
        location / {
            proxy_pass http://portal;
        }
    }
}
